<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - USIU AI Advisor</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .auth-box { background: white; width: 100%; max-width: 400px; padding: 40px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #8B0000; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 0.95em; }
        input:focus { border-color: #8B0000; outline: none; }
        button { width: 100%; background-color: #8B0000; color: white; padding: 12px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        button:hover { background-color: #a30000; }
        .alert { padding: 10px; margin-bottom: 15px; border-radius: 4px; font-size: 0.9em; text-align: left; }
        .danger { background-color: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        .success { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .info { background-color: #e3f2fd; color: #0d47a1; border: 1px solid #bbdefb; }
        .link { display: block; margin-top: 20px; color: #8B0000; text-decoration: none; font-weight: 500; }
        .link:hover { text-decoration: underline; }
        
        @media (max-width: 480px) {
            .auth-box { padding: 25px; margin: 15px; }
        }
    </style>
</head>
<body>

<div class="auth-box">
    <h1>USIU-Africa</h1>
    <p>AI Major Advisor Portal</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/login">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <input type="email" name="email" placeholder="Email Address" autocomplete="email" required>
        <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit">Login</button>
    </form>

    <a href="{{ url_for('register') }}" class="link">Don't have an account? Register</a>
</div>

</body>
</html>
